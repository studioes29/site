name: Récupérer les fichiers du site en ligne
on:
  push:
    paths: ['.github/assets.txt', '.github/workflows/recuperer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recuperer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger depuis studioes.fr
        run: |
          set -u
          ok=0; ko=0; : > .github/manquants.txt
          while read -r f; do
            [ -z "$f" ] && continue
            [ -e "$f" ] && continue
            mkdir -p "$(dirname "$f")"
            if curl -fsSL --retry 3 -o "$f" "https://studioes.fr/$f"; then ok=$((ok+1)); else rm -f "$f"; echo "$f" >> .github/manquants.txt; ko=$((ko+1)); fi
          done < .github/assets.txt
          if [ -f site.webmanifest ]; then
            python3 -c "import json;[print(i['src'].lstrip('/')) for i in json.load(open('site.webmanifest')).get('icons',[])]" | while read -r f; do [ -e "$f" ] || curl -fsSL -o "$f" "https://studioes.fr/$f" || echo "$f" >> .github/manquants.txt; done
          fi
          echo "ok=$ok ko=$ko"
      - name: Enregistrer
        run: |
          git config user.name "studio-es-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fichiers du site récupérés depuis studioes.fr"
          git push
